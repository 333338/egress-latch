appId: com.ip-guard.desktop
productName: EgressLatch
asar: true
npmRebuild: false
directories:
  output: release-posix
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
extraResources:
  - from: dist/posix
    to: posix
  - from: ../browser-extension/dist
    to: browser-extension
  - from: assets
    to: assets
  - from: dist/release-info.json
    to: release-info.json
mac:
  category: public.app-category.utilities
  icon: assets/icon.png
  identity: "-"
  hardenedRuntime: false
  notarize: false
  target: [dmg, zip]
  artifactName: EgressLatch-macOS-Preview-${version}-${arch}.${ext}
linux:
  category: Utility
  icon: assets/icon.png
  executableName: ip-guard
  maintainer: chxcodepro
  synopsis: Managed Claude IPv4 proxy gate
  target: [AppImage, deb]
  artifactName: EgressLatch-Linux-Preview-${version}-${arch}.${ext}
publish: null
